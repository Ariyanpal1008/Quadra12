    <line x1="0" y1="42" x2="74" y2="42" stroke="#000000" stroke-opacity="0.45"/>
    <text x="37" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#F5F2EB">85</text>
    <text x="37" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#787066">DAYS</text>

    <rect x="84" y="0" width="74" height="84" rx="10" fill="#1E1B18" stroke="#332E28"/>
    <line x1="84" y1="42" x2="158" y2="42" stroke="#000000" stroke-opacity="0.45"/>
    <text x="121" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#F5F2EB">14</text>
    <text x="121" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#787066">HOURS</text>

    <rect x="168" y="0" width="74" height="84" rx="10" fill="#1E1B18" stroke="#332E28"/>
    <line x1="168" y1="42" x2="242" y2="42" stroke="#000000" stroke-opacity="0.45"/>
    <text x="205" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#F5F2EB">32</text>
    <text x="205" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#787066">MINS</text>

    <rect x="252" y="0" width="74" height="84" rx="10" fill="#1E1B18" stroke="#332E28"/>
    <line x1="252" y1="42" x2="326" y2="42" stroke="#000000" stroke-opacity="0.45"/>
    <text x="289" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#D4785E">09</text>
    <text x="289" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#787066">SECS</text>
  </g>

  <!-- Compact My Achievements Card Preview -->
  <rect x="38" y="294" width="684" height="108" rx="12" fill="#F5F2EB" stroke="#DDD6C7" stroke-width="1.5"/>
  <text x="58" y="319" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#A64B33">MILESTONES &amp; BADGES</text>
  <text x="58" y="344" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700" fill="#1E1B18">My Achievements · 9 Milestone Seals</text>
  <text x="58" y="366" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#575048">Quick Learner (3–5 ch/day) · Exam Ready (&gt;90% score)</text>
  <text x="58" y="384" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#575048">Syllabus Sprinter · Quadra 12 Grandmaster (50/50)</text>

