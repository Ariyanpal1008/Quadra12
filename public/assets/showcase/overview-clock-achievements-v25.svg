<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="Quadra 12 Overview Board Countdown Clock and My Achievements Preview">
  <rect width="760" height="440" rx="16" fill="#F5F2EB"/>
  <rect x="16" y="16" width="728" height="408" rx="14" fill="#FAF8F3" stroke="#DDD6C7" stroke-width="1.5"/>

  <!-- Top Header Strip -->
