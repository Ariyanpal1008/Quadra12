  <circle cx="484" cy="348" r="13" fill="#E8F0EA" stroke="#3D6B4F" stroke-width="2"/>
  <circle cx="508" cy="348" r="13" fill="#FBF3E4" stroke="#B7791F" stroke-width="2"/>
  <circle cx="532" cy="348" r="13" fill="#F7EBE7" stroke="#A64B33" stroke-width="2"/>
  <rect x="562" y="331" width="142" height="34" rx="8" fill="#1E1B18"/>
  <text x="633" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#F5F2EB">Launch App →</text>
