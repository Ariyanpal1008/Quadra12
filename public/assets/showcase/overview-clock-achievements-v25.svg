  <text x="38" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E1B18">Every second toward CBSE Boards 2027</text>
  <rect x="598" y="38" width="124" height="30" rx="8" fill="#F5F2EB" stroke="#DDD6C7"/>
  <text x="660" y="57" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1E1B18">Auto: Feb 16</text>

  <line x1="38" y1="96" x2="722" y2="96" stroke="#DDD6C7"/>

  <!-- Circular Chronometer Dial -->
  <g transform="translate(102, 190)">
    <circle cx="0" cy="0" r="56" fill="none" stroke="#E5DFD2" stroke-width="7"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#A64B33" stroke-width="7" stroke-linecap="round" stroke-dasharray="352" stroke-dashoffset="82" transform="rotate(-90)"/>
    <circle cx="0" cy="-56" r="4" fill="#1E1B18"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#1E1B18">85</text>
