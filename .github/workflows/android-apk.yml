name: Build Free Android APK (Quadra 12)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor CLI & Android platform
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android
          npx cap add android

      - name: Apply Quadra 12 launcher icons & permissions
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          for dir_size in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            DIR="${dir_size%%:*}"
            SIZE="${dir_size##*:}"
            mkdir -p "android/app/src/main/res/$DIR"
            convert public/pwa-512x512.png -resize "${SIZE}x${SIZE}" -strip "android/app/src/main/res/$DIR/ic_launcher.png"
            convert public/pwa-maskable-512x512.png -resize "${SIZE}x${SIZE}" -strip "android/app/src/main/res/$DIR/ic_launcher_round.png"
            convert public/pwa-maskable-512x512.png -resize "${SIZE}x${SIZE}" -strip "android/app/src/main/res/$DIR/ic_launcher_foreground.png"
          done
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Quadra12-Android.apk

      - name: Upload Quadra12-Android.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quadra12-Android-APK
          path: Quadra12-Android.apk
          retention-days: 90

      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Quadra12-Android.apk
