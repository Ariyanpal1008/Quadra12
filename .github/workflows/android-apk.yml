name: Build Free Android APK (Quadra 12)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor CLI & Android platform
        run: |
          npm install --save-dev --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android
          npx cap add android

      - name: Configure Android applicationId & dynamic versionCode for seamless in-place updates
        run: |
          node -e '
          const fs = require("fs");
          const gradlePath = "android/app/build.gradle";
          if (fs.existsSync(gradlePath)) {
            let content = fs.readFileSync(gradlePath, "utf8");
            content = content.replace(/applicationId\s+"[^"]+"/, "applicationId \"io.github.ariyanpal1008.quadra12\"");
            content = content.replace(/versionCode\s+\d+/, "versionCode ${{ github.run_number }}");
            content = content.replace(/versionName\s+"[^"]+"/, "versionName \"2.6\"");
            fs.writeFileSync(gradlePath, content, "utf8");
          }
          '

      - name: Configure Android permissions, camera intents & native Downloads bridge
        run: |
          node << 'NODE_EOF'
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(manifestPath, "utf8");
          const permissionsBlock = [
            '    <uses-permission android:name="android.permission.CAMERA" />',
            '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
            '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
            '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
            '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
            '    <queries>',
            '        <intent>',
            '            <action android:name="android.media.action.IMAGE_CAPTURE" />',
            '        </intent>',
            '        <intent>',
            '            <action android:name="android.intent.action.GET_CONTENT" />',
            '        </intent>',
            '        <intent>',
            '            <action android:name="android.intent.action.OPEN_DOCUMENT" />',
            '        </intent>',
            '        <intent>',
            '            <action android:name="android.intent.action.VIEW" />',
            '            <data android:mimeType="application/pdf" />',
            '        </intent>',
            '    </queries>',
          ].join("\n");
          manifest = manifest.replace("</manifest>", "\n" + permissionsBlock + "\n</manifest>");
          fs.writeFileSync(manifestPath, manifest, "utf8");

          const filePathsPath = "android/app/src/main/res/xml/file_paths.xml";
          if (fs.existsSync(filePathsPath)) {
            let fp = fs.readFileSync(filePathsPath, "utf8");
            if (!fp.includes("external-path")) {
              fp = fp.replace("</paths>", '    <external-path name="external_files" path="." />\n</paths>');
              fs.writeFileSync(filePathsPath, fp, "utf8");
            }
          }
          NODE_EOF

          mkdir -p android/app/src/main/java/io/github/ariyanpal1008/quadra12
          cat << 'EOF' > android/app/src/main/java/io/github/ariyanpal1008/quadra12/MainActivity.java
          package io.github.ariyanpal1008.quadra12;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_PERMISSIONS = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebSettings settings = getBridge().getWebView().getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setAllowFileAccess(true);
                      getBridge().getWebView().addJavascriptInterface(
                          new QuadraAndroidBridge(),
                          "QuadraAndroid"
                      );
                  }

                  requestStartupPermissions();
              }

              private void requestStartupPermissions() {
                  List<String> needed = new ArrayList<>();
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      needed.add(Manifest.permission.CAMERA);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES)
                              != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_IMAGES);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE)
                              != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      }
                      if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P &&
                              ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                                      != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                      }
                  }
                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(
                          this,
                          needed.toArray(new String[0]),
                          REQ_PERMISSIONS
                      );
                  }
              }

              public class QuadraAndroidBridge {
                  @JavascriptInterface
                  public boolean ensureCameraPermission() {
                      if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)
                              == PackageManager.PERMISSION_GRANTED) {
                          return true;
                      }
                      runOnUiThread(() -> ActivityCompat.requestPermissions(
                          MainActivity.this,
                          new String[]{ Manifest.permission.CAMERA },
                          1002
                      ));
                      return false;
                  }

                  @JavascriptInterface
                  public boolean ensureStoragePermission() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          return true;
                      }
                      if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                              == PackageManager.PERMISSION_GRANTED) {
                          return true;
                      }
                      runOnUiThread(() -> ActivityCompat.requestPermissions(
                          MainActivity.this,
                          new String[]{ Manifest.permission.WRITE_EXTERNAL_STORAGE },
                          1003
                      ));
                      return false;
                  }

                  @JavascriptInterface
                  public String saveBase64File(String base64Data, String filename, String mimeType) {
                      try {
                          String safeName = (filename == null || filename.trim().isEmpty())
                              ? "Quadra12-Export.pdf"
                              : filename.replaceAll("[^a-zA-Z0-9._-]", "_");
                          String resolvedMime = (mimeType == null || mimeType.trim().isEmpty())
                              ? "application/pdf"
                              : mimeType;
                          byte[] fileBytes = Base64.decode(base64Data, Base64.DEFAULT);

                          Uri viewUri = null;
                          String displayPath = "Downloads/Quadra12/" + safeName;

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver resolver = getContentResolver();
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                              values.put(MediaStore.MediaColumns.MIME_TYPE, resolvedMime);
                              values.put(
                                  MediaStore.MediaColumns.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS + "/Quadra12"
                              );
                              values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                              Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) {
                                  return "ERROR:Failed to create file in Downloads/Quadra12.";
                              }
                              try (OutputStream out = resolver.openOutputStream(uri)) {
                                  if (out == null) {
                                      return "ERROR:Unable to open download output stream.";
                                  }
                                  out.write(fileBytes);
                                  out.flush();
                              }
                              values.clear();
                              values.put(MediaStore.MediaColumns.IS_PENDING, 0);
                              resolver.update(uri, values, null, null);
                              viewUri = uri;
                          } else {
                              if (ContextCompat.checkSelfPermission(
                                      MainActivity.this,
                                      Manifest.permission.WRITE_EXTERNAL_STORAGE
                                  ) != PackageManager.PERMISSION_GRANTED) {
                                  runOnUiThread(() -> ActivityCompat.requestPermissions(
                                      MainActivity.this,
                                      new String[]{ Manifest.permission.WRITE_EXTERNAL_STORAGE },
                                      1003
                                  ));
                                  return "ERROR:Storage permission required. Tap Allow, then tap Save PDF again.";
                              }
                              File downloadsRoot = Environment.getExternalStoragePublicDirectory(
                                  Environment.DIRECTORY_DOWNLOADS
                              );
                              File appDir = new File(downloadsRoot, "Quadra12");
                              if (!appDir.exists()) {
                                  appDir.mkdirs();
                              }
                              File outFile = new File(appDir, safeName);
                              try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                  fos.write(fileBytes);
                                  fos.flush();
                              }
                              MediaScannerConnection.scanFile(
                                  MainActivity.this,
                                  new String[]{ outFile.getAbsolutePath() },
                                  new String[]{ resolvedMime },
                                  null
                              );
                              viewUri = FileProvider.getUriForFile(
                                  MainActivity.this,
                                  getPackageName() + ".fileprovider",
                                  outFile
                              );
                          }

                          final Uri finalUri = viewUri;
                          final String finalMime = resolvedMime;
                          final String finalPath = displayPath;
                          runOnUiThread(() -> {
                              Toast.makeText(
                                  MainActivity.this,
                                  "Saved to " + finalPath,
                                  Toast.LENGTH_LONG
                              ).show();
                              if (finalUri != null && "application/pdf".equals(finalMime)) {
                                  try {
                                      Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                                      viewIntent.setDataAndType(finalUri, finalMime);
                                      viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                      startActivity(Intent.createChooser(viewIntent, "Open Quadra 12 PDF"));
                                  } catch (Exception ignored) {
                                      // No PDF viewer installed; file is still saved in Downloads/Quadra12
                                  }
                              }
                          });

                          return "OK:" + displayPath;
                      } catch (Exception ex) {
                          return "ERROR:" + (ex.getMessage() != null ? ex.getMessage() : "File save failed.");
                      }
                  }
              }
          }
          EOF

      - name: Apply Quadra 12 launcher icons & sync assets
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir_size in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            DIR="${dir_size%%:*}"
            SIZE="${dir_size##*:}"
            mkdir -p "android/app/src/main/res/$DIR"
            convert public/pwa-512x512.png -resize "${SIZE}x${SIZE}" -strip "android/app/src/main/res/$DIR/ic_launcher.png"
            convert public/pwa-maskable-512x512.png -resize "${SIZE}x${SIZE}" -strip "android/app/src/main/res/$DIR/ic_launcher_round.png"
            convert public/pwa-maskable-512x512.png -resize "${SIZE}x${SIZE}" -strip "android/app/src/main/res/$DIR/ic_launcher_foreground.png"
          done
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Quadra12-v2.6-Android.apk

      - name: Upload Quadra12-v2.6-Android.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quadra12-Android-APK
          path: Quadra12-v2.6-Android.apk
          retention-days: 90

      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Quadra12-v2.6-Android.apk
